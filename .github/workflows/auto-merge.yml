name: auto-merge

# Privileged workflow. Human review required for any change to this file.
# Enables GitHub's native auto-merge (squash) on:
#   1. Dependabot PRs that are patch/minor updates
#   2. Any PR carrying the `auto-merge` label
# The branch ruleset still enforces: PR required + `ci` check green. This file
# never merges anything itself; it only flips the auto-merge flag and lets
# GitHub merge once the ruleset is satisfied.
#
# Requires repo setting: Actions > General > Workflow permissions >
#   "Allow GitHub Actions to create and approve pull requests" = ON.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  enable:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'auto-merge')
    steps:
      - name: Dependabot metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: >
          github.event.pull_request.user.login != 'dependabot[bot]' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge --auto --squash "$PR" --repo "$GITHUB_REPOSITORY"

  # Arms GitHub-native auto-merge on every non-draft PR the moment it opens.
  # GitHub then merges it itself once the ruleset (PR + `ci` green) is satisfied —
  # no polling, no webhook, nothing running on Alex's PC. PRs touching guarded
  # paths (workflows, CODEOWNERS, AGENTS.md, CLAUDE.md, .env*, secrets/, data/)
  # get a `needs-review` label instead, unless dependabot authored them.
  arm-on-open:
    runs-on: ubuntu-latest
    if: >
      contains(fromJSON('["opened","reopened","ready_for_review"]'), github.event.action) &&
      github.event.pull_request.draft == false
    steps:
      - name: Arm native auto-merge or label needs-review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          GUARDED='(^|/)(\.github/workflows/|\.github/CODEOWNERS$|AGENTS\.md$|CLAUDE\.md$|\.env|secrets/|data/)'
          if [ "$AUTHOR" != "dependabot[bot]" ]; then
            HITS=$(gh pr diff "$PR" --repo "$REPO" --name-only | grep -E "$GUARDED" || true)
            if [ -n "$HITS" ]; then
              echo "PR #$PR touches guarded paths — labeling needs-review instead of arming:"
              echo "$HITS"
              gh label create needs-review --repo "$REPO" --color d93f0b \
                --description "touches a guarded path, needs a human or the gatekeeper sweep" --force
              gh pr edit "$PR" --repo "$REPO" --add-label needs-review
              exit 0
            fi
          fi
          gh pr merge "$PR" --repo "$REPO" --auto --squash \
            || echo "PR #$PR: auto-merge not armed (already merged/armed, or not in a mergeable state yet) — not a failure"
